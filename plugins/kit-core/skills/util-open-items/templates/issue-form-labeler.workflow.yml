# Issue-form labeler — mirrors Issue Form dropdown answers to axis labels.
#
# Why this exists: GitHub Issue Forms cannot set labels per dropdown answer
# (research 0002 §2), so this workflow parses the form's rendered body sections
# (### Priority / ### Size) on issues:opened|edited and applies the matching
# `priority:` / `size:` labels per ADR-0009 §5. The `type:` label needs no
# mirroring: each per-type form applies it statically (ADR-0009 §4), and there
# is no marker label — the section parse is the scope guard, so issues whose
# body carries no form-rendered Priority/Size headings are left untouched.
#
# Implementation choice (Plan-0003 increment 06): a self-contained
# actions/github-script step instead of the third-party Advanced Issue Labeler —
# zero external dependency, supports the critical→p0 value mapping, and enforces
# axis exclusivity (one label per axis) by removing stale same-axis labels on edit.
#
# Run scripts/bootstrap_labels.sh --apply before enabling this workflow: the
# addLabels API auto-creates missing labels with random colors, and the
# bootstrap is what keeps names/colors/descriptions canonical (ADR-0009 §5).

name: issue-form-labeler

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  mirror-form-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror Priority/Size dropdowns to axis labels
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const current = context.payload.issue.labels.map(l => l.name);

            // Parse "### <Heading>\n\n<value>" sections as rendered by Issue Forms.
            const section = (heading) => {
              const m = body.match(new RegExp(`###\\s+${heading}\\s*\\n+\\s*([^\\n]+)`, 'i'));
              return m ? m[1].trim() : null;
            };

            // axis prefix -> { parsed form value -> label }
            const axes = {
              'priority:': {
                'critical': 'priority:p0',
                'high': 'priority:p1',
                'medium': 'priority:p2',
                'low': 'priority:p3',
              },
              'size:': {
                'S': 'size:S',
                'M': 'size:M',
                'L': 'size:L',
              },
            };
            const headings = { 'priority:': 'Priority', 'size:': 'Size' };

            const toAdd = [];
            const toRemove = [];
            for (const [prefix, map] of Object.entries(axes)) {
              const raw = section(headings[prefix]);
              if (!raw) continue;                      // section absent: leave axis alone
              const want = map[raw] ?? map[raw.toUpperCase?.()] ?? null;
              if (!want) {
                core.warning(`Unmapped ${headings[prefix]} value: "${raw}" — axis left unchanged`);
                continue;
              }
              // Axis exclusivity: drop any other label with this prefix.
              for (const l of current) {
                if (l.startsWith(prefix) && l !== want) toRemove.push(l);
              }
              if (!current.includes(want)) toAdd.push(want);
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            for (const name of toRemove) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name })
                .catch(e => core.warning(`removeLabel ${name}: ${e.message}`));
            }
            if (toAdd.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: toAdd });
            }
            core.info(`added: [${toAdd}] removed: [${toRemove}]`);
