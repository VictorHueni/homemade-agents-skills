# Task — per-type Issue Form for the github backend (ADR-0009 §4;
# references/github-backend.md §2a/§2b in util-open-items). Serializes the
# governance §2 `execution-item` taxonomy value.
#
# PRECONDITION: run scripts/bootstrap_labels.sh --apply first — GitHub silently
# skips `labels:` entries that do not exist on the repo.
#
# This form applies `type:task` statically; the Priority and Size dropdown
# answers are mirrored to `priority:` / `size:` labels by the labeler workflow
# (forms cannot set labels per answer). Field `id:` keys equal the canonical
# slugs (Invariant I1) — do not rename an `id:`, rename the label instead.
#
# No duplicate-search checkbox by design: issues here are filed by the operator
# or by agents whose contract requires a duplicate/dependency search before
# creation (Plan-0003 increments 07/12). Add the conventional required
# "I have searched the existing issues" checkbox if external filers arrive.

name: Task
description: Concrete work item — not a feature, not broken.
labels: ["type:task", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        The issue **title** is the summary — one self-contained sentence. This issue
        starts as `needs-triage`; **References** and **Acceptance criteria** must be
        filled before triage can promote it to `ready-for-agent`.


  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done, and why.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: >-
        Code pointers an executor needs — files, symbols, prior PRs, patterns to
        imitate. Required before promotion to `ready-for-agent`.
      placeholder: |
        - plugins/kit-core/skills/util-open-items/SKILL.md (Mode 2)
        - prior art: PR #4
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: >-
        Observable pass/fail checklist, ending with a runnable check. Required
        before promotion to `ready-for-agent`.
      placeholder: |
        - [ ] X behaves like Y under Z
        - [ ] verify: bash scripts/foo.sh --dry-run exits 0
    validations:
      required: false

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What must NOT be touched or changed while resolving this (optional).
    validations:
      required: false

  - type: input
    id: source_artefact
    attributes:
      label: Source artefact
      description: Repo-relative path to the originating document, if any.
      placeholder: docs/architecture/decisions/adr-0002-....md
    validations:
      required: false

  - type: input
    id: source_anchor
    attributes:
      label: Source anchor
      description: Fragment identifier into the source document (e.g. #q3).
      placeholder: "#tooling-consequences"
    validations:
      required: false

  - type: input
    id: source_heading
    attributes:
      label: Source heading
      description: The heading the anchor resolves to, or _central-only_.
      placeholder: Tooling consequences
    validations:
      required: false

  - type: textarea
    id: resolution_path
    attributes:
      label: Resolution path
      description: What closing this item looks like in practice (optional).
      placeholder: Schedule into refactor epic E-07
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: "Mirrored to a `priority:` label — p0=critical, p1=high, p2=medium, p3=low."
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: One-PR effort bound, mirrored to a `size:` label. L = consider splitting before delegating.
      options:
        - S
        - M
        - L
    validations:
      required: true
