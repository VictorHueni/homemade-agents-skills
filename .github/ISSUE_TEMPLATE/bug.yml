# Bug report — per-type Issue Form for the github backend (ADR-0009 §4;
# references/github-backend.md §2a/§2b in util-open-items).
#
# PRECONDITION: run scripts/bootstrap_labels.sh --apply first — GitHub silently
# skips `labels:` entries that do not exist on the repo.
#
# This form applies `type:bug` statically; the Priority and Size dropdown
# answers are mirrored to `priority:` / `size:` labels by the labeler workflow
# (forms cannot set labels per answer). Field `id:` keys equal the canonical
# slugs (Invariant I1) — do not rename an `id:`, rename the label instead.

name: Bug report
description: Something is broken — wrong behaviour, error, or regression.
labels: ["type:bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        The issue **title** is the summary — one self-contained sentence. This issue
        starts as `needs-triage`; **References** and **Acceptance criteria** must be
        filled before triage can promote it to `ready-for-agent`.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: "Mirrored to a `priority:` label — p0=critical, p1=high, p2=medium, p3=low."
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: One-PR effort bound, mirrored to a `size:` label. L = consider splitting before delegating.
      options:
        - S
        - M
        - L
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
      placeholder: Running X produces Y; expected Z.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps or a minimal repro that triggers the bug.
      placeholder: |
        1. Run `bash scripts/foo.sh --bar`
        2. Observe the error on step 2
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, tool versions, config — anything needed to reproduce (optional).
      render: shell
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: >-
        Code pointers an executor needs — files, symbols, prior PRs, patterns to
        imitate. Required before promotion to `ready-for-agent`.
      placeholder: |
        - plugins/kit-core/skills/util-open-items/SKILL.md (Mode 2)
        - prior art: PR #4
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: >-
        Observable pass/fail checklist, ending with a runnable check. Required
        before promotion to `ready-for-agent`.
      placeholder: |
        - [ ] X behaves like Y under Z
        - [ ] verify: bash scripts/foo.sh --dry-run exits 0
    validations:
      required: false
